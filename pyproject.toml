[project]
name = "mainai"
version = "0.1.0"
description = "Pick the right coding agent to continue a project with, across Claude Code, Codex, and Grok sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mainai = "mainai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mainai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
